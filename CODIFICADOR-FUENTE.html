<div class="page-outer">

  <div class="card">
    <h2>Conversión Analógico a Digital (ADC) Integrada</h2>

    <!-- Controles interactivos -->
    <div class="controls">
      <div class="control-group">
        <label for="sampleRate">1. Muestreo (Muestras/Ciclo): <span id="rateVal" style="color:#1a73e8;">12</span></label>
        <input type="range" id="sampleRate" min="6" max="24" value="12" step="2" oninput="updateProcess()">
      </div>
      <div class="control-group">
        <label for="levels">2. Cuantificación (Niveles): <span id="levelVal" style="color:#f9ab00;">8</span></label>
        <input type="range" id="levels" min="4" max="16" value="8" step="4" oninput="updateProcess()">
      </div>
    </div>

    <!-- Gráfico unificado -->
    <canvas id="adcChart" height="130"></canvas>

    <!-- Salida en tiempo real de Codificación -->
    <div class="binary-container">
      <div class="binary-title">3. Codificación (Trama de Bits PCM Generada en Tiempo Real):</div>
      <div id="binaryStream" class="binary-stream">Cargando...</div>
    </div>
  </div>

  <script>
    let adcChart;

    function processADC(sampleRate, numLevels) {
      let continuousSignal = [];
      let sampledPoints = [];
      let quantizedSignal = [];
      let binaryStreamHTML = "";

      // Número de bits necesarios según los niveles (ej. 8 niveles = 3 bits)
      let bitsPerSample = Math.log2(numLevels);
      let stepSize = 2 / (numLevels - 1); // Rango de la onda de -1 a 1 (Total = 2)

      let sampleInterval = Math.round(360 / sampleRate);

      for (let t = 0; t <= 360; t += 2) {
        let rad = t * Math.PI / 180;
        let val = Math.sin(rad); // Onda analógica original
        continuousSignal.push({x: t, y: val});

        // En los puntos de muestreo
        if (t % sampleInterval === 0) {
          sampledPoints.push({x: t, y: val});

          // Calcular el nivel cuantificado (escalón)
          let levelIndex = Math.round((val + 1) / stepSize);
          let qVal = (levelIndex * stepSize) - 1;
          quantizedSignal.push({x: t, y: qVal});

          // Convertir el nivel a código binario
          let binaryCode = levelIndex.toString(2).padStart(bitsPerSample, '0');
          binaryStreamHTML += `<span class="bit-group">${binaryCode}</span>`;
        }
      }

      return { continuousSignal, sampledPoints, quantizedSignal, binaryStreamHTML };
    }

    function initADCChart() {
      const ctx = document.getElementById('adcChart').getContext('2d');
      const data = processADC(12, 8);

      document.getElementById('binaryStream').innerHTML = data.binaryStreamHTML;

      adcChart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Señal Analógica Continua',
              data: data.continuousSignal,
              borderColor: '#1a73e8',
              borderWidth: 2,
              pointRadius: 0,
              fill: false,
              tension: 0.3
            },
            {
              label: 'Señal Cuantificada (Escalones)',
              data: data.quantizedSignal,
              borderColor: '#f9ab00',
              borderWidth: 2,
              stepped: 'before',
              pointRadius: 0,
              fill: false
            },
            {
              label: 'Muestras Tomadas',
              data: data.sampledPoints,
              borderColor: '#d93025',
              backgroundColor: '#d93025',
              pointRadius: 5,
              showLine: false
            }
          ]
        },
        options: {
          responsive: true,
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: { type: 'linear', title: { display: true, text: 'Tiempo / Fase (°)' } },
            y: { min: -1.2, max: 1.2, title: { display: true, text: 'Amplitud (V)' } }
          }
        }
      });
    }

    function updateProcess() {
      let sampleRate = parseInt(document.getElementById('sampleRate').value);
      let levels = parseInt(document.getElementById('levels').value);

      document.getElementById('rateVal').innerText = sampleRate;
      document.getElementById('levelVal').innerText = levels;

      let newData = processADC(sampleRate, levels);

      adcChart.data.datasets[0].data = newData.continuousSignal;
      adcChart.data.datasets[1].data = newData.quantizedSignal;
      adcChart.data.datasets[2].data = newData.sampledPoints;
      adcChart.update();

      document.getElementById('binaryStream').innerHTML = newData.binaryStreamHTML;
    }

    window.onload = initADCChart;
  </script>
